[project]
name = "hr-staffing-pipeline"
version = "0.1.0"
description = "Loads HR Excel exports into DuckDB and builds the project_staffing model with dbt"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbt-core>=1.12.5",
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "pandas[excel]>=3.0.5",
    "pandera>=0.33.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
